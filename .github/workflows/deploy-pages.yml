name: Deploy public tax knowledge map

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp site/index.html site/styles.css site/app.js _site/
          cp .ua/knowledge-graph.json _site/data/knowledge-graph.json
          cp -R wiki _site/wiki
          find . -maxdepth 1 -type f -name '*.png' -exec cp {} _site/ \;
          if [ -d Snippets ]; then cp -R Snippets _site/Snippets; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
