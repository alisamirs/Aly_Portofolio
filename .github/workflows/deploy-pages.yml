name: Deploy public portfolio knowledge graph

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Render Quarto notes
        run: timeout 10m quarto render content/acca/tx-uk --to html --no-execute
      - name: Bundle public graph and notes
        shell: bash
        run: |
          rm -rf dashboard/public dashboard/dist
          mkdir -p dashboard/public
          cp .ua/knowledge-graph.json dashboard/public/knowledge-graph.json
          cp -R wiki dashboard/public/wiki
          cp -R content/acca/tx-uk/rendered/source dashboard/public/acca-tx-uk
          find content/acca/tx-uk/source -maxdepth 1 -type f -name '*.png' -exec cp {} dashboard/public/acca-tx-uk/ \;
          if [ -d Snippets ]; then cp -R Snippets dashboard/public/Snippets; fi
      - name: Build full static dashboard
        working-directory: dashboard
        run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist
      - uses: actions/deploy-pages@v4
