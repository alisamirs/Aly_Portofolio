    <text
       xml:space="preserve"
       style="font-family:'Arial';fill:#ffffff;stroke:none;"
       x="230"
       y="20"
       id="curriculum-text">
        <tspan x="230" y="20" style="font-size:10px;font-weight:bold;">Detailed study guide</tspan>
        <tspan x="230" dy="25" style="font-size:8px;font-weight:bold;">1. The UK Tax system and its administration</tspan>
        <tspan x="240" dy="12" style="font-size:7px;">1.1. The overall function and purpose of taxation in a modern economy</tspan>
        <tspan x="250" dy="10" style="font-size:6px;">- Describe the purpose (economic, social etc) of taxation in a modern economy</tspan>
        <tspan x="250" dy="8" style="font-size:6px;">- Explain the difference between direct and indirect taxation</tspan>
        <tspan x="250" dy="8" style="font-size:6px;">- Identify the different types of capital and revenue tax.</tspan>
        <tspan x="230" dy="12" style="font-size:8px;font-weight:bold;">1.2. Principal sources of revenue law and practice</tspan>
        <tspan x="250" dy="10" style="font-size:6px;">- Describe the overall structure of the UK tax system</tspan>
        <tspan x="250" dy="8" style="font-size:6px;">- State the different sources of revenue law</tspan>
        <tspan x="250" dy="8" style="font-size:6px;">- Describe the organisation HM Revenue & Customs (HMRC) and its terms of reference</tspan>
        <tspan x="250" dy="8" style="font-size:6px;">- Appreciate the interaction of the UK tax system with that of other tax jurisdictions</tspan>
        <tspan x="250" dy="8" style="font-size:6px;">- Appreciate the need for double taxation agreements</tspan>
        <tspan x="250" dy="8" style="font-size:6px;">- Explain the need for an ethical and professional approach</tspan>
        <tspan x="230" dy="12" style="font-size:8px;font-weight:bold;">1.3. The systems for self-assessment and the making of returns</tspan>
        <tspan x="250" dy="10" style="font-size:6px;">- Explain and apply the features of the self-assessment system as it applies to individuals</tspan>
        <tspan x="250" dy="8" style="font-size:6px;">- Explain and apply the features of the self-assessment system as it applies to companies, including the use of iXBRL</tspan>
        <tspan x="230" dy="12" style="font-size:8px;font-weight:bold;">1.4. The time limits for the submission of information, claims and payment of tax, including payments on account</tspan>
        <tspan x="250" dy="10" style="font-size:6px;">- Recognise the time limits that apply to the filing of returns and the making of claims</tspan>
        <tspan x="250" dy="8" style="font-size:6px;">- Recognise the due dates for the payment of tax under the self-assessment system, and compute payments on account and balancing payments/repayments for individuals</tspan>
        <tspan x="250" dy="8" style="font-size:6px;">- Explain how large companies are required to account for corporation tax on a quarterly basis and compute the quarterly instalment payments</tspan>
        <tspan x="250" dy="8" style="font-size:6px;">- List the information and records that taxpayers need to retain for tax purposes</tspan>
        <tspan x="230" dy="12" style="font-size:8px;font-weight:bold;">1.5. The procedures relating to compliance checks, appeals and disputes</tspan>
        <tspan x="250" dy="10" style="font-size:6px;">- Explain the circumstances in which HM Revenue & Customs can make a compliance check into a self-assessment tax return</tspan>
        <tspan x="250" dy="8" style="font-size:6px;">- Explain the procedures for dealing with appeals and First and Upper Tier Tribunals</tspan>
        <tspan x="230" dy="12" style="font-size:8px;font-weight:bold;">1.6. Penalties for non-compliance</tspan>
        <tspan x="250" dy="10" style="font-size:6px;">- Calculate late payment interest and state the penalties that can be charged</tspan>
    </text>
