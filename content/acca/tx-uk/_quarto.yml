project:
  type: default
  # Render every root-level Quarto document automatically.
  render:
    - "source/*.qmd"

  output-dir: rendered

format:
  html:
    toc: true
    number-sections: true
    theme:
      light: flatly
      dark: darkly
  pdf:
    pdf-engine: lualatex
    toc: true
    toc-depth: 3
    number-sections: true
    papersize: a4
    geometry:
      - margin=2.5cm
    include-in-header:
      - mdpi-header.tex

bibliography: mdpi-template.bib

execute:
  enabled: false
  freeze: auto
